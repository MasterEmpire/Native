<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CORTEX OS</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.1);
            --border: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
            --editor-card-bg: rgba(45, 45, 48, 0.6);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: transparent; color: var(--text);
            overflow: hidden;
            /* MAKE TEXT UNSELECTABLE */
            user-select: none;
            -webkit-user-select: none;
            /* PREVENT BROWSER GESTURES (Pull-to-refresh, overscroll) */
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-drag: none;
        }

        .wallpaper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://cortex.local/wallpaper.jpg');
            background-size: cover; background-position: center;
            z-index: -1; filter: brightness(0.6);
        }

        /* MASTER WRAPPER */
        .stage {
            position: relative; width: 100vw; height: 100vh;
            perspective: 1000px;
        }

        .view-screen {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: flex; flex-direction: column;
            backface-visibility: hidden;
            perspective: 1000px;
            will-change: transform, opacity;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease-out;
        }

        /* EDITOR MODE SCALING */
        body.editor-active .stage {
            transform: scale(0.72) translateY(-5vh);
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        body.editor-active .home-page {
            background: var(--editor-card-bg);
            border-radius: 54px;
            border: 1.5px solid rgba(255,255,255,0.15);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            margin: 0 15px;
        }

        body.editor-active .trash-header {
            display: flex !important;
        }

        body.editor-active #drawer-screen {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* --- SCREEN 1: HOME --- */
        #home-screen {
            z-index: 1;
            opacity: 1;
            transform: translate3d(0, 0, 0);
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
        }
        #home-screen::-webkit-scrollbar { display: none; }

        .home-page {
            min-width: 100vw; height: 100%;
            scroll-snap-align: center;
            display: flex; flex-direction: column;
            transition: all 0.4s ease;
            position: relative;
        }

        .trash-header {
            display: none;
            width: 100%;
            padding-top: 30px;
            flex-direction: column;
            align-items: center;
            z-index: 100;
        }

        .trash-icon {
            width: 22px; height: 24px; border: 2px solid #fff; border-bottom-radius: 4px; position: relative; margin-bottom: 20px;
        }
        .trash-icon::before { content: ''; position: absolute; top: -5px; left: 50%; transform: translateX(-50%); width: 8px; height: 3px; border: 2px solid #fff; border-bottom: none; }
        .trash-icon::after { content: ''; position: absolute; top: -2px; left: -5px; width: 30px; height: 2px; background: #fff; }
        
        .editor-divider { width: 85%; height: 1px; background: rgba(255,255,255,0.2); }
        
        body.drawer-active #home-screen {
            transform: translate3d(0, -20vh, 0); 
            opacity: 0;
            pointer-events: none;
        }

        .home-content {
            padding-top: 80px;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center; cursor: pointer;
        }

        .home-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: min-content;
            gap: 20px 10px;
            padding: 30px 20px;
            overflow-y: auto;
            scrollbar-width: none;
        }
        .home-grid::-webkit-scrollbar { display: none; }
        #main-clock { 
            font-size: 2.8rem;
            font-weight: 300; 
            text-shadow: 0 2px 15px rgba(0,0,0,0.3); 
            margin-bottom: 2px; 
        }
        #main-date { 
            font-size: 0.85rem; 
            opacity: 0.7; 
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
        }

        .dock {
            height: 130px; width: 100%;
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            /* Lift dock higher to match One UI padding above Nav Bar */
            padding: 0 25px 45px 25px;
        }

        /* --- SCREEN 2: DRAWER --- */
        #drawer-screen {
            z-index: 10;
            pointer-events: none;
            /* Start completely below the viewport */
            transform: translate3d(0, 100%, 0);
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(15px);
            /* Optimize for performance */
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.3s ease, visibility 0.3s;
        }
        
        body.drawer-active #drawer-screen {
            pointer-events: auto;
            transform: translate3d(0, 0, 0);
        }

        .search-wrapper { padding: 40px 25px 5px 25px; }
        .search-bar {
            height: 46px; background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(25px); border-radius: 24px;
            display: flex; align-items: center; padding: 0 18px; gap: 12px;
        }
        #search-input { flex: 1; background: transparent; border: none; color: #fff; font-size: 1.05rem; outline: none; }
        #search-input::placeholder { color: rgba(255,255,255,0.5); }
        .search-menu { color: #fff; opacity: 0.7; font-size: 1.2rem; cursor: pointer; padding-left: 5px; }

        .pager {
            flex: 1; display: flex; overflow-x: auto;
            scroll-snap-type: x mandatory; scrollbar-width: none;
            /* Allow horizontal native scroll, but block vertical browser interference */
            touch-action: pan-x;
        }
        .pager::-webkit-scrollbar { display: none; }

        .grid-page {
            min-width: 100vw; height: 100%;
            scroll-snap-align: start; scroll-snap-stop: always;
            display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(6, 1fr);
            /* One UI has large top/bottom gutters */
            padding: 20px 15px 10px 15px; 
            row-gap: 22px; 
            column-gap: 5px;
        }

        .app-item { display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer; }
        .app-item:active { transform: scale(0.9); opacity: 0.6; }
        .app-icon {
            width: 48px; height: 48px; 
            border-radius: 22%; 
            margin-bottom: 5px; 
            object-fit: cover;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
            background: rgba(255,255,255,0.05);
            transition: transform 0.1s;
            pointer-events: none;
        }

        /* Specifically enlarge only the Home Screen Dock icons */
        .dock .app-icon {
            width: 62px; height: 62px;
            margin-bottom: 0;
        }
        .app-label {
            font-size: 0.78rem; 
            width: 95%; 
            line-height: 1.2;
            margin-top: 2px;
            max-height: 2.4em; 
            display: -webkit-box; 
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; 
            overflow: hidden;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .pagination-dots {
            height: 30px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 0px; 
            margin-bottom: 45px; /* Sits perfectly above the nav bar */
            flex-shrink: 0; 
        }
        .dot {
            width: 14px; height: 14px; 
            background: #fff; border-radius: 50%; 
            opacity: 0.2; 
            cursor: pointer; 
            /* Visual dot is now ~4px */
            padding: 5px; 
            background-clip: content-box;
            transition: opacity 0.2s;
            box-sizing: border-box;
        }
        .dot.active { opacity: 0.8; }

        /* CONTEXT MENU */
        #context-menu {
            position: fixed;
            z-index: 1000;
            background: rgba(40, 40, 40, 0.95);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 18px;
            width: 180px;
            display: none;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: menuPop 0.2s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        /* EDITOR OVERLAY ELEMENTS */
        #editor-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; opacity: 0; z-index: 500;
            transition: opacity 0.4s ease;
            display: flex; flex-direction: column; align-items: center;
        }
        body.editor-active #editor-overlay { opacity: 1; pointer-events: auto; }

        .editor-top-icon { margin-top: 55px; }
        .editor-house-svg { width: 28px; height: 28px; fill: none; stroke: rgba(255,255,255,0.6); stroke-width: 2; }

        .editor-pagination { margin-top: auto; margin-bottom: 30px; display: flex; align-items: center; gap: 12px; }
        .editor-symbol { color: #666; font-size: 20px; font-weight: bold; }


        @keyframes menuPop { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        
        .menu-item {
            padding: 14px 18px;
            font-size: 0.85rem;
            color: #eee;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .menu-item:active { background: rgba(255,255,255,0.1); }
        .menu-item.danger { color: #ff5e5e; }
        .menu-item:last-child { border-bottom: none; }
    </style>
</head>
<body>

    <div class="wallpaper"></div>

    <div id="editor-overlay">
        <div class="editor-top-icon">
            <svg class="editor-house-svg" viewBox="0 0 24 24"><path d="M3 10L12 3L21 10V20C21 20.5523 20.5523 21 20 21H15V15H9V21H4C3.44772 21 3 20.5523 3 20V10Z" /></svg>
        </div>
        
        <div class="editor-pagination">
            <span class="editor-symbol">=</span>
            <div id="editor-dots" style="display:flex; gap:8px;"></div>
            <span class="editor-symbol" onclick="addHomePage()" style="cursor:pointer">+</span>
        </div>


    </div>

    <div class="stage" onclick="handleGlobalClick(event)" ontouchstart="handleHomeTouchStart(event)" ontouchend="handleHomeTouchEnd()">
        <!-- SCREEN 1: HOME -->
        <div class="view-screen" id="home-screen"></div>

        <!-- SCREEN 2: DRAWER -->
        <div class="view-screen" id="drawer-screen">
            <div class="search-wrapper"><div class="search-bar"><input type="text" id="search-input" placeholder="Search" oninput="handleSearch()"><div class="search-menu">⋮</div></div></div>
            <div class="pager" id="pager" onscroll="updateDots()"></div>
            <div class="pagination-dots" id="dots"></div>
        </div>
    </div>

    <!-- Context Menu Placeholder -->
    <div id="context-menu"></div>

    <script>
        let allApps = [];
        let dockPkgs = JSON.parse(localStorage.getItem('cortex_dock') || '["dialer", "messaging", "chrome", "telegram"]');
        // Refactor to support multiple pages
        let homePages = JSON.parse(localStorage.getItem('cortex_home_pages') || '[[]]');
        let startY = 0, startX = 0;
        let longPressTimer = null;
        let homePressTimer = null;

        function updateTime() {
            const now = new Date();
            document.getElementById('main-clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
            document.getElementById('main-date').innerText = now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
        }

        function launchClock() {
            if (isEditorActive()) return;
            const clockApp = allApps.find(a => a.pkg.toLowerCase().includes('clock') || a.pkg.toLowerCase().includes('deskclock'));
            if (clockApp) CortexLauncher.launch(clockApp.pkg);
        }

        function renderAll(appsList) {
            const homeScreen = document.getElementById('home-screen');
            homeScreen.innerHTML = '';

            const activeDockApps = [];
            dockPkgs.forEach(pkg => {
                const match = allApps.find(a => a.pkg.toLowerCase().includes(pkg.toLowerCase()));
                if (match && !activeDockApps.find(d => d.pkg === match.pkg)) activeDockApps.push(match);
            });
            const dockHtml = activeDockApps.slice(0, 4).map(app => `
                <div class="app-item" onclick="!isEditorActive() && CortexLauncher.launch('${app.pkg}')" ontouchstart="handlePressStart(event, '${app.pkg}', true, false)" ontouchend="handlePressEnd()" ontouchcancel="handlePressEnd()">
                    <img class="app-icon" src="${app.icon}">
                </div>`).join('');

            homePages.forEach((pageShortcuts, pageIdx) => {
                const page = document.createElement('div');
                page.className = 'home-page';
                
                const gridHtml = pageShortcuts.map(pkg => {
                    const app = allApps.find(a => a.pkg === pkg);
                    if (!app) return '';
                    return `
                        <div class="app-item" onclick="!isEditorActive() && CortexLauncher.launch('${app.pkg}')" ontouchstart="handlePressStart(event, '${app.pkg}', false, true)" ontouchend="handlePressEnd()" ontouchcancel="handlePressEnd()">
                            <img class="app-icon" src="${app.icon}">
                            <div class="app-label">${app.name}</div>
                        </div>`;
                }).join('');

                page.innerHTML = `
                    <div class="trash-header" onclick="removeHomePage(${pageIdx})"><div class="trash-icon"></div><div class="editor-divider"></div></div>
                    <div class="home-content" onclick="launchClock()">
                        <div id="main-clock">${document.getElementById('main-clock')?.innerText || '00:00'}</div>
                        <div id="main-date">${document.getElementById('main-date')?.innerText || '...'}</div>
                    </div>
                    <div class="home-grid">${gridHtml}</div>
                    <div class="dock">${dockHtml}</div>
                `;
                homeScreen.appendChild(page);
            });

            updateEditorDots();

            // Render Grid
            const pager = document.getElementById('pager');
            const dots = document.getElementById('dots');
            pager.innerHTML = ''; dots.innerHTML = '';

            for (let i = 0; i < appsList.length; i += 24) {
                const chunk = appsList.slice(i, i + 24);
                const page = document.createElement('div');
                page.className = 'grid-page';
                page.innerHTML = chunk.map(app => `
                    <div class="app-item" 
                         onclick="CortexLauncher.launch('${app.pkg}')" 
                         ontouchstart="handlePressStart(event, '${app.pkg}', false)" 
                         ontouchend="handlePressEnd()" 
                         ontouchcancel="handlePressEnd()">
                        <img class="app-icon" src="${app.icon}" loading="lazy">
                        <div class="app-label">${app.name}</div>
                    </div>
                `).join('');
                pager.appendChild(page);
                const dot = document.createElement('div');
                dot.className = 'dot' + (i === 0 ? ' active' : '');
                
                // Teleportation Logic
                const pageIdx = Math.floor(i / 24);
                dot.onclick = () => jumpToPage(pageIdx);
                
                dots.appendChild(dot);
            }
        }

        function jumpToPage(idx) {
            const pager = document.getElementById('pager');
            pager.scrollTo({
                left: idx * window.innerWidth,
                behavior: 'smooth'
            });
        }

        function handlePressStart(e, pkg, isDock, isHome) {
            // Cache coordinates immediately; 'e' will be recycled by the OS before the timeout fires
            const touchX = e.touches[0].clientX;
            const touchY = e.touches[0].clientY;
            longPressTimer = setTimeout(() => {
                showContextMenu(touchX, touchY, pkg, isDock, isHome);
            }, 600);
        }

        function handlePressEnd() {
            clearTimeout(longPressTimer);
        }

        function showContextMenu(x, y, pkg, isDock, isHome) {
            const menu = document.getElementById('context-menu');
            const app = allApps.find(a => a.pkg === pkg);
            if (!app) return;

            const menuWidth = 180;
            const renderX = Math.min(x, window.innerWidth - menuWidth - 20);
            const renderY = Math.min(y, window.innerHeight - 200);

            let html = `<div class="menu-item" onclick="CortexLauncher.openAppInfo('${pkg}')">ℹ️ App Info</div>`;

            if (isDock) {
                html += `<div class="menu-item danger" onclick="removeFromDock('${pkg}')">➖ Remove from Dock</div>`;
            } else if (isHome) {
                html += `<div class="menu-item danger" onclick="removeFromHome('${pkg}')">➖ Remove from Home</div>`;
            } else {
                html += `<div class="menu-item" onclick="addToHome('${pkg}')">➕ Add to Home</div>`;
                if (!app.isSystem) {
                    html += `<div class="menu-item danger" onclick="CortexLauncher.requestUninstall('${pkg}')">🗑️ Uninstall</div>`;
                }
            }

            menu.innerHTML = html;
            menu.style.left = renderX + 'px';
            menu.style.top = renderY + 'px';
            menu.style.display = 'flex';
        }

        function closeMenu() {
            document.getElementById('context-menu').style.display = 'none';
        }

        function handleGlobalClick(e) {
            // 1. Close context menu if open
            closeMenu();

            // 2. Handle Editor Mode dismissal
            if (isEditorActive()) {
                // Don't close if we clicked the 'Trash' or '+' buttons
                if (e.target.closest('.trash-header') || e.target.closest('.editor-symbol')) {
                    return;
                }
                document.body.classList.remove('editor-active');
                e.stopPropagation();
            }
        }

        function addToHome(pkg) {
            if (dockPkgs.length < 4 && !dockPkgs.includes(pkg)) {
                dockPkgs.push(pkg);
                localStorage.setItem('cortex_dock', JSON.stringify(dockPkgs));
            } else {
                // Add to first page that has space
                let added = false;
                for(let page of homePages) {
                    if (page.length < 24 && !page.includes(pkg)) {
                        page.push(pkg); added = true; break;
                    }
                }
                if (!added) homePages.push([pkg]);
                localStorage.setItem('cortex_home_pages', JSON.stringify(homePages));
            }
            renderAll(allApps);
            closeMenu();
        }

        function removeFromHome(pkg) {
            homeShortcuts = homeShortcuts.filter(p => p !== pkg);
            localStorage.setItem('cortex_home_grid', JSON.stringify(homeShortcuts));
            renderAll(allApps);
            closeMenu();
        }

        function removeFromDock(pkg) {
            dockPkgs = dockPkgs.filter(p => p !== pkg);
            localStorage.setItem('cortex_dock', JSON.stringify(dockPkgs));
            renderAll(allApps);
            closeMenu();
        }

        function updateDots() {
            closeMenu();
            const pager = document.getElementById('pager');
            const dots = document.querySelectorAll('#dots .dot');
            const idx = Math.round(pager.scrollLeft / window.innerWidth);
            dots.forEach((d, i) => d.classList.toggle('active', i === idx));
        }

        function updateEditorDots() {
            const dotsBox = document.getElementById('editor-dots');
            if(!dotsBox) return;
            dotsBox.innerHTML = '';
            const idx = Math.round(document.getElementById('home-screen').scrollLeft / window.innerWidth);
            homePages.forEach((_, i) => {
                const d = document.createElement('div');
                d.className = 'dot' + (i === idx ? ' active' : '');
                d.style.cssText = "width:8px; height:8px; background:" + (i === idx ? '#fff' : '#444') + "; border-radius:50%;";
                dotsBox.appendChild(d);
            });
        }

        // EDITOR LOGIC
        function isEditorActive() { return document.body.classList.contains('editor-active'); }
        
        function handleHomeTouchStart(e) {
            if (isEditorActive()) return;
            // Only trigger if we touch the background, not an app
            if (e.target.closest('.app-item')) return;
            
            homePressTimer = setTimeout(() => {
                enterEditorMode();
            }, 600);
        }

        function handleHomeTouchEnd() {
            clearTimeout(homePressTimer);
        }

        function enterEditorMode() {
            document.body.classList.add('editor-active');
            updateEditorDots();
        }

        function addHomePage() {
            homePages.push([]);
            localStorage.setItem('cortex_home_pages', JSON.stringify(homePages));
            renderAll(allApps);
        }

        function removeHomePage(idx) {
            if (homePages.length <= 1) return;
            homePages.splice(idx, 1);
            localStorage.setItem('cortex_home_pages', JSON.stringify(homePages));
            renderAll(allApps);
        }

        document.getElementById('home-screen').onscroll = () => {
            if(isEditorActive()) updateEditorDots();
        };

        function handleSearch() {
            const query = document.getElementById('search-input').value.toLowerCase();
            renderAll(allApps.filter(a => a.name.toLowerCase().includes(query)));
        }

        // GESTURE ENGINE
        window.addEventListener('touchstart', e => { 
            startY = e.touches[0].clientY; 
            startX = e.touches[0].clientX;
        }, { passive: false });

        window.addEventListener('touchmove', e => {
            const moveX = Math.abs(e.touches[0].clientX - startX);
            const moveY = Math.abs(e.touches[0].clientY - startY);
            // If user moves more than 10px, they are swiping, not long-pressing
            if (moveX > 10 || moveY > 10) {
                handlePressEnd();
                closeMenu();
            }
        }, { passive: false });

        window.addEventListener('touchend', e => {
            const endY = e.changedTouches[0].clientY;
            const diff = startY - endY;
            const isActive = document.body.classList.contains('drawer-active');

            // diff > 50: Swiped UP
            // diff < -50: Swiped DOWN
            if (!isActive && diff > 50) {
                document.body.classList.add('drawer-active');
            } else if (isActive && diff < -50) {
                // Only close if swiping DOWN while in drawer
                document.body.classList.remove('drawer-active');
            }
        });

        window.showHomeScreen = () => {
            document.body.classList.remove('drawer-active');
            closeMenu();
        };

        window.handleBack = () => {
            // 1. Close context menu if open
            const menu = document.getElementById('context-menu');
            if (menu && menu.style.display === 'flex') {
                closeMenu();
                return true;
            }
            // 2. Close Editor if active
            if (document.body.classList.contains('editor-active')) {
                document.body.classList.remove('editor-active');
                return true;
            }
            // 3. Close app drawer if open
            if (document.body.classList.contains('drawer-active')) {
                showHomeScreen();
                return true;
            }
            return false;
        };

        window.onload = () => {
            try {
                const raw = CortexLauncher.getAppList();
                allApps = JSON.parse(raw).sort((a,b) => a.name.localeCompare(b.name));
                renderAll(allApps);
                setInterval(updateTime, 1000); updateTime();
            } catch (e) { }
        };
    </script>
</body>
</html>
