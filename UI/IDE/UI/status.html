<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --icon-fill: #ffffff;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            
            /* Dimensions */
            --bar-height: 26px;      /* Lean status bar */
            --line-thickness: 15px; /* Increased by 3px (was 12px) */
            --line-gap: 5px;        /* Transparent gap size */
            --line-width: 125px;    /* Increased to 125px */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            font-family: var(--font-family);
            overflow: hidden;
            height: 100vh;
        }

        /* The Lean Black Bar */
        .status-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--bar-height);
            background-color: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            box-sizing: border-box;
            user-select: none;
            z-index: 9999;
        }

        .clock {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-color);
            letter-spacing: -0.1px;
        }

        /* Right Side Icons Container */
        .status-right-icons {
            display: flex;
            align-items: center;
            gap: 12px; /* Slightly more gap for larger icons */
        }

        .icon-container {
            display: flex;
            align-items: center;
        }

        .custom-alarm-icon { height: 16px; width: auto; }
        .custom-alarm-icon path { fill: var(--icon-fill); }

        .signal-bars {
            display: flex;
            align-items: flex-end;
            gap: 1.5px;
            height: 12px;
        }

        .bar {
            width: 1.5px;
            background-color: var(--icon-fill);
        }
        .bar.b1 { height: 30%; }
        .bar.b2 { height: 50%; }
        .bar.b3 { height: 75%; }
        .bar.b4 { height: 100%; }

        .battery-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .battery-percentage {
            font-size: 13px; /* Slightly larger to match battery */
            font-weight: 700;
            color: var(--text-color);
        }

        /* 50% Larger Battery Icon */
        .battery-wrapper {
            position: relative;
            width: 16px;  /* Was 11px */
            height: 24px; /* Was 16px */
            display: flex;
            align-items: center;
        }

        .battery-icon-shell {
            position: absolute;
            width: 16px;
            height: 24px;
            fill: var(--icon-fill);
            opacity: 0.3;
        }

        .battery-fill-clip {
            position: absolute;
            width: 16px;
            height: 24px;
            fill: var(--icon-fill);
            clip-path: inset(0% 0 0 0); 
            transition: clip-path 0.5s ease;
        }

        /* 
           DETACHED ACCENT BAR 
           Black color and larger dimensions
        */
        .bottom-accent-bar {
            position: absolute;
            top: calc(var(--bar-height) + var(--line-gap));
            right: 14px; 
            
            width: var(--line-width); 
            height: var(--line-thickness);
            
            background-color: #000000; /* Made it Black */
            border-radius: calc(var(--line-thickness) / 2); 
            z-index: 9998;
        }
    </style>
</head>
<body>

<div class="status-bar">
    <div class="status-left" onclick="if(window.Cortex) Cortex.close()">
        <div class="clock" id="time">--:-- --</div>
    </div>
    
    <div class="status-right-icons">
        <!-- Ringer Mode Indicators -->
        <div id="ringer-silent" class="icon-container" style="display: none; margin-right: 2px;">
            <svg width="14" height="14" viewBox="0 0 24 24">
                <path fill="var(--icon-fill)" d="M3.27,3L2,4.27l5,5V19c0,0.55,0.45,1,1,1h3l5,5V14.27l4.46,4.46c-0.15,0.08-0.3,0.14-0.46,0.2v2.09c0.77-0.18,1.46-0.51,2.06-0.93 l1.6,1.6L21,20.45L3.27,3z M11,18l-2.58-2.58L7,15.42V11.27l2.58,2.58L11,15.42V18z M11.5,3l-2.1,2.1l2.1,2.1V3z M17,11 c0-1.77-1.02-3.29-2.5-4.03v2.09c0.57,0.33,1,0.88,1,1.54c0,0.11-0.02,0.22-0.05,0.32l1.6,1.6C16.9,12.01,17,11.52,17,11z M14.5,4.01 v2.09c1.69,0.85,2.75,2.44,2.75,4.4c0,1.21-0.44,2.32-1.15,3.19l1.49,1.49c1.02-1.29,1.66-2.91,1.66-4.68 C19.25,7.02,17.27,4.35,14.5,4.01z" />
            </svg>
        </div>
        <div id="ringer-vibrate" class="icon-container" style="display: none; margin-right: 2px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="16" viewBox="0 0 33 35" version="1.1">
                <path fill="var(--icon-fill)" opacity="1" d="M 5 4 L 3 6 L 7 11 L 2 12 L 1 15 Q 0 20 2 22 Q 4 24 11 23 L 21 32 L 22 31 L 22 21 L 5 4 Z M 20 4 L 14 9 L 22 16 L 22 5 L 20 4 Z M 28 4 L 23 9 L 26 13 L 23 18 L 26 22 L 23 27 L 24 29 L 28 32 L 29 31 L 27 28 L 29 24 Q 30 19 27 19 L 29 15 Q 30 10 27 10 L 29 7 Q 30 3 28 4 Z "/>
            </svg>
        </div>

        <!-- Airplane Indicator -->
        <div id="airplane-indicator" class="icon-container" style="display: none; margin-right: 2px;">
            <svg width="15" height="15" viewBox="0 0 24 24">
                <path fill="var(--icon-fill)" d="M21,16v-2l-8,-5V3.5c0,-0.83 -0.67,-1.5 -1.5,-1.5c-0.83,0 -1.5,0.67 -1.5,1.5V9l-8,5v2l8,-2.5V19l-2,1.5V22l3.5,-1l3.5,1v-1.5L13,19v-5.5L21,16z"/>
            </svg>
        </div>



        <!-- 4G Data Indicator -->
        <div id="data-indicator" class="icon-container" style="display: none; margin-right: 4px; align-items: flex-end; padding-bottom: 2px;">
            <div style="font-size: 11px; font-weight: 900; line-height: 12px; letter-spacing: -0.2px; margin-right: 2px; color: var(--text-color);">4G</div>
            <svg width="11" height="12" viewBox="0 0 12 12" style="margin-bottom: 1px;">
                <path d="M3.5,0 L7,4 H4.5 V8 H2.5 V4 H0 Z" fill="var(--icon-fill)" />
                <path d="M8.5,12 L5,8 H7.5 V4 H9.5 V8 H12 Z" fill="var(--icon-fill)" opacity="0.5"/>
            </svg>
        </div>

        <!-- Signal Bars -->
        <div id="signal-bars" class="signal-bars">
            <div class="bar b1"></div>
            <div class="bar b2"></div>
            <div class="bar b3"></div>
            <div class="bar b4"></div>
        </div>

        <!-- Larger Battery -->
        <div class="battery-group">
            <span class="battery-percentage" id="batt-level">--%</span>
            <div class="battery-wrapper">
                <svg class="battery-icon-shell" viewBox="0 0 24 24">
                    <path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/>
                </svg>
                <svg id="batt-fill" class="battery-fill-clip" viewBox="0 0 24 24">
                    <path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/>
                </svg>
            </div>
        </div>
    </div>
</div>

<!-- Detached Thick Black Accent Bar -->
<div class="bottom-accent-bar"></div>

<script>
    function updateTime() {
        const now = new Date();
        let hours = now.getHours();
        let minutes = now.getMinutes();
        const ampm = hours >= 12 ? 'pm' : 'am';
        hours = hours % 12 || 12; 
        minutes = minutes < 10 ? '0' + minutes : minutes;
        document.getElementById('time').textContent = hours + ':' + minutes + ' ' + ampm;
    }

    function updateBattery() {
        let level = 100;
        try { if (window.Cortex) level = Cortex.getBattery(); } catch (e) {}
        document.getElementById('batt-level').textContent = level + '%';
        document.getElementById('batt-fill').style.clipPath = `inset(${100 - level}% 0 0 0)`;
    }
    
    function updateDynamicIcons() {
        let isAirplane = false;
        let isData = false;
        let ringerMode = 2; // Default NORMAL

        try {
            if (window.Cortex) {
                if (Cortex.getConfigBool) {
                    isAirplane = Cortex.getConfigBool("fake_tile_airplane", false);
                    isData = Cortex.getConfigBool("fake_tile_data", false);
                }
                if (Cortex.getRingerMode) {
                    ringerMode = Cortex.getRingerMode();
                }
            }
        } catch (e) {}

        const airplaneEl = document.getElementById('airplane-indicator');
        const silentEl = document.getElementById('ringer-silent');
        const vibrateEl = document.getElementById('ringer-vibrate');
        const dataEl = document.getElementById('data-indicator');
        const signalEl = document.getElementById('signal-bars');

        if (isAirplane) {
            airplaneEl.style.display = 'flex';
            dataEl.style.display = 'none';
            signalEl.style.display = 'none';
            silentEl.style.display = 'none';
            vibrateEl.style.display = 'none';
        } else {
            airplaneEl.style.display = 'none';
            signalEl.style.display = 'flex';
            dataEl.style.display = isData ? 'flex' : 'none';
            
            // Ringer Logic (Only shown when NOT in airplane mode)
            silentEl.style.display = (ringerMode === 0) ? 'flex' : 'none';
            vibrateEl.style.display = (ringerMode === 1) ? 'flex' : 'none';
        }
    }

    updateTime();
    updateBattery();
    updateDynamicIcons();
    setInterval(updateTime, 1000);
    setInterval(updateBattery, 5000);
    setInterval(updateDynamicIcons, 1000);
</script>
</body>
</html>
