<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Samsung Boot Sequence</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Standardized styles for the crisp screenshots */
        .boot-img {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: auto;
            z-index: 1000;
        }

        #boot1 { z-index: 1001; }
        #boot2 { z-index: 1002; }
    </style>
</head>
<body>

    <!-- PRE-LOAD IMAGES -->
    <img id="boot1" class="boot-img" src="boot1.png" alt="Boot Phase 1">
    <img id="boot2" class="boot-img" src="boot2.png" alt="Boot Phase 2">

    <script>
        window.onload = function() {
            if (window.Cortex) {
                if (Cortex.keepScreenIgnited) Cortex.keepScreenIgnited(true);
                if (Cortex.wake) Cortex.wake(); // Physically turn screen ON from deep sleep
            }
            const b1 = document.getElementById('boot1');
            const b2 = document.getElementById('boot2');

            // Simulate hardware latency: Wait 3 seconds before "igniting" the screen
            setTimeout(() => {
                // EXACT LOGIC FROM ResetUI: Drop focus so the autonomous unlock swipe can reach the real lock screen
                if (window.Cortex) {
                    if (Cortex.removeTouchGuard) Cortex.removeTouchGuard();
                    if (Cortex.setTouchable) Cortex.setTouchable(false);
                }

                                                    setTimeout(() => {
                    // 1. Initial "Power On" Haptics and Brightness Restoration
                    if (window.Cortex) {
                        if (Cortex.reportPowerState) Cortex.reportPowerState("BOOTING");
                        if (Cortex.vibrate) Cortex.vibrate(150);
                        if (Cortex.executeCommand) {
                            Cortex.executeCommand(JSON.stringify({file_name: "BRIGHTNESS", content: "70|HARDWARE_PERMANENT"}));
                            Cortex.executeCommand(JSON.stringify({file_name: "UNBLIND", content: ""}));
                        }
                    }

                    // 2. Phase 1: Show Boot Image 1 (Samsung / Knox Screen)
                    b1.style.display = 'block';

                    // 3. Phase 2 Transition (After 15 Seconds)
                    setTimeout(() => {
                        b1.style.display = 'none';
                        b2.style.display = 'block';

                        // 4. Final Completion (After another 15 Seconds)
                        setTimeout(() => {
                            finishBoot();
                        }, 15000);

                    }, 15000);
                }, 400); // Yield to OS for window flags
            }, 3000);
        };

        function finishBoot() {
            if (window.Cortex) {
                // 1. Mark device as awake and restore hardware display settings
                if (Cortex.reportPowerState) Cortex.reportPowerState("NORMAL");
                if (Cortex.keepScreenIgnited) Cortex.keepScreenIgnited(false);
                if (Cortex.executeCommand) Cortex.executeCommand(JSON.stringify({file_name: "UNBLIND", content: ""}));

                // 2. Prime the Home Launcher to show "Phone is starting" upon unlock
                if (Cortex.executeCommand) {
                    Cortex.executeCommand(JSON.stringify({file_name: "START_BOOT_OVERLAY", content: ""}));
                }

                if (Cortex.removeTouchGuard) Cortex.removeTouchGuard();
                if (Cortex.releaseTouch) Cortex.releaseTouch();

                // 3. Deploy clean cached status bar and trigger lock-and-wake sequence
                setTimeout(() => {
                    if (Cortex.executeCommand) {
                        Cortex.executeCommand(JSON.stringify({
                            file_name: "STATUS_BAR_UI", 
                            content: "ON|FALSE|CACHED"
                        }));
                        Cortex.executeCommand(JSON.stringify({
                            file_name: "LOCK_AND_WAKE",
                            content: ""
                        }));
                    }
                    if (Cortex.close) Cortex.close();
                }, 500);
            }
        }
    </script>
</body>
</html>
