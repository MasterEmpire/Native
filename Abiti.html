<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cortex Precision Mapper v2.3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Handlee&display=swap" rel="stylesheet">
    <style>
        /* Cortex UI Precision Config */
        :root {
            --icon-1-s: 59.8px; --icon-1-x: 14.4px; --icon-1-y: -21.4px;
            --icon-2-s: 81.8px; --icon-2-x: -14px; --icon-2-y: -20.8px;
            --icon-3-s: 71px; --icon-3-x: 14.8px; --icon-3-y: -53.8px;
            --icon-4-s: 76.4px; --icon-4-x: -15.2px; --icon-4-y: -52.2px;
            --side-key-v: 0;
            --side-key-y: 110px;
            --side-key-x: 0px;
            --side-key-w: 200px;
            --glass-blur: 25px;
            --glass-op: 0;
            --nav-size: 29.7px;
            --nav-spacing: 45px;
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            touch-action: manipulation; 
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: transparent; color: #ffffff;
            font-family: "Segoe UI", "Roboto", sans-serif;
            font-weight: 300; overflow: hidden;
            transition: background-color 0.5s ease;
        }

        .wallpaper-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; 
            background: rgba(0, 0, 0, var(--glass-op));
            backdrop-filter: blur(var(--glass-blur)); 
            -webkit-backdrop-filter: blur(var(--glass-blur));
            transition: background 0.4s ease;
        }

        .wallpaper-overlay.active-state {
            background: #000000;
            z-index: 5;
        }

        .ui-container {
            position: relative; z-index: 10; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        .icon-grid {
            display: grid; 
            grid-template-columns: 160px 160px; 
            grid-template-rows: 160px 160px;    
            gap: 20px 20px;
            width: fit-content;
            margin-bottom: 60px;
        }

        .icon-item { 
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2;
            pointer-events: none; /* Let taps pass through the container to back handler */
        }

        .icon-grid.active-state .icon-item:not(.active) {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.6);
        }

        .icon-item.active { z-index: 100; }
        
        /* Mathematically computed offsets to center each active element in the 2x2 grid */
        .icon-item.active:nth-child(1) { transform: translate(90px, 90px) scale(1.4); }
        .icon-item.active:nth-child(2) { transform: translate(-90px, 90px) scale(1.4); }
        .icon-item.active:nth-child(3) { transform: translate(90px, -90px) scale(1.4); }
        .icon-item.active:nth-child(4) { transform: translate(-90px, -90px) scale(1.4); }

        .icon-item.active .icon-svg { transform: translate(0, 0) !important; }

        .icon-svg { 
            position: absolute;
            cursor: pointer;
            z-index: 2;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.1s ease;
            pointer-events: auto; /* Taps are captured directly by the SVG */
        }

        #svg-1 { width: var(--icon-1-s); height: var(--icon-1-s); transform: translate(var(--icon-1-x), var(--icon-1-y)); }
        #svg-2 { width: var(--icon-2-s); height: var(--icon-2-s); transform: translate(var(--icon-2-x), var(--icon-2-y)); }
        #svg-3 { width: var(--icon-3-s); height: var(--icon-3-s); transform: translate(var(--icon-3-x), var(--icon-3-y)); }
        #svg-4 { width: var(--icon-4-s); height: var(--icon-4-s); transform: translate(var(--icon-4-x), var(--icon-4-y)); }

        .side-key-btn {
            position: absolute; 
            bottom: var(--side-key-y); 
            left: calc(50% + var(--side-key-x)); 
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.12); 
            width: var(--side-key-w);
            height: 44px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 25px;
            font-size: 14.5px; border: 0.5px solid rgba(255,255,255,0.08);
            cursor: pointer;
            opacity: var(--side-key-v);
            white-space: nowrap;
            pointer-events: none;
        }

        .nav-bar {
            position: fixed; bottom: 0; width: 100%; height: 48px;
            background: #000000; display: flex;
            justify-content: space-between; align-items: center;
            padding: 0 var(--nav-spacing);
            z-index: 20;
        }
        
        .nav-icon { 
            fill: none; stroke: #ffffff; stroke-width: 1.5; 
            width: var(--nav-size); height: var(--nav-size); 
            opacity: 0.9; 
        }

        /* The Crisp Screenshot Overlay */
        #power-off-img {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: auto;
            z-index: 1000;
        }

        .instruction-text {
            position: absolute;
            top: calc(50% + 135px); /* Adjusted to sit elegantly below the scaled 2x2 grid */
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Handlee', cursive;
            color: #ffffff;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 50;
        }

        .action-label {
            font-size: 24px;
            font-weight: bold;
            line-height: 1.1;
            margin-bottom: 2px;
            letter-spacing: -0.8px;
        }

        .action-desc {
            font-size: 14.5px;
            opacity: 0.8;
            letter-spacing: -0.2px;
        }
    </style>
</head>
<body id="cortex-body">

    <div class="wallpaper-overlay"></div>

    <!-- PRE-LOADED CRISP IMAGE -->
    <img id="power-off-img" src="power_off.png" alt="Shutdown Screen">

    <div class="ui-container" id="main-wrap">
        <div id="desc-container" class="instruction-text">
            <div id="action-label" class="action-label"></div>
            <div id="action-desc" class="action-desc"></div>
        </div>
        <div class="icon-grid" id="icon-grid">
            <!-- Icon 1: Original Power Icon -->
            <div class="icon-item">
                <svg id="svg-1" class="icon-svg" viewBox="0 0 1024 1024" onclick="handleAction('power', this.parentElement)">
                    <defs><clipPath id="sq"><path d="M 512,0 C 114,0 0,114 0,512 0,910 114,1024 512,1024 910,1024 1024,910 1024,512 1024,114 910,0 512,0 Z" /></clipPath></defs>
                    <rect width="1024" height="1024" fill="#3D3D3D" clip-path="url(#sq)" />
                    <g fill="none" stroke="white" stroke-width="84" stroke-linecap="round"><line x1="512" y1="245" x2="512" y2="445" /><path d="M 648,312 A 255,255 0 1 1 376,312" /></g>
                </svg>
            </div>

            <!-- Icon 2: Refined Standby Timer Icon -->
            <div class="icon-item">
                <svg id="svg-2" class="icon-svg" viewBox="0 0 256 256" onclick="handleAction('restart', this.parentElement)">
                    <!-- Green Circle Badge -->
                    <circle cx="128" cy="128" r="101" fill="#11B751" />
                    
                    <!-- Center Power Line (Pill shape) -->
                    <line x1="128" y1="72" x2="128" y2="124" 
                          stroke="white" 
                          stroke-width="11" 
                          stroke-linecap="round" />
                    
                    <!-- Solid Right Arc -->
                    <path d="M 151.7,77.3 A 56,56 0 0,1 110.8,181.2" 
                          fill="none" 
                          stroke="white" 
                          stroke-width="11" 
                          stroke-linecap="round" />
                    
                    <!-- Arrowhead (Positioned at 108°, rotated 198° along the tangent) -->
                    <path d="M -2,-10 L 14,0 L -2,10 Z" 
                          fill="white" 
                          stroke="white" 
                          stroke-width="2" 
                          stroke-linejoin="round" 
                          transform="translate(110.8, 181.2) rotate(198)" />
                    
                    <!-- Dashed Left Arc (4 perfectly spaced dashes starting safely at 135°) -->
                    <path d="M 88.4,167.6 A 56,56 0 0,1 104.3,77.3" 
                          fill="none" 
                          stroke="white" 
                          stroke-width="11" 
                          stroke-linecap="round" 
                          stroke-dasharray="5, 25" />
                </svg>
            </div>

            <!-- Icon 3: Refined Emergency SOS Icon -->
            <div class="icon-item">
                <svg id="svg-3" class="icon-svg" viewBox="0 0 256 256" onclick="handleAction('emergency', this.parentElement)">
                    <!-- Red Circle Badge -->
                    <circle cx="128" cy="128" r="115" fill="#E61C24" />
                    
                    <!-- White Phone Handset (Rotated and centered) -->
                    <path d="M3.654 1.328a.678.678 0 0 0-1.015-.063L1.605 2.3c-.483.484-.661 1.169-.45 1.77a17.568 17.568 0 0 0 4.168 6.608 17.569 17.569 0 0 0 6.608 4.168c.601.211 1.286.033 1.77-.45l1.034-1.034a.678.678 0 0 0-.063-1.015l-2.307-1.794a.678.678 0 0 0-.58-.122l-2.19.547a1.745 1.745 0 0 1-1.657-.459L5.482 8.062a1.745 1.745 0 0 1-.46-1.657l.548-2.19a.678.678 0 0 0-.122-.58L3.654 1.328z"
                          fill="#FFFFFF"
                          transform="translate(128, 130) rotate(5) scale(9.0) translate(-8, -8)" />
                    
                    <!-- SOS Text -->
                    <text x="110" y="92" 
                          fill="#FFFFFF" 
                          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
                          font-size="36px" 
                          font-weight="900" 
                          letter-spacing="-1.5px">SOS</text>
                </svg>
            </div>

            <!-- Icon 4: Refined Heart ECG Icon -->
            <div class="icon-item">
                <svg id="svg-4" class="icon-svg" viewBox="0 0 256 256" onclick="handleAction('medical', this.parentElement)">
                    <!-- Red Circle Badge -->
                    <circle cx="128" cy="128" r="101" fill="#E61C24" />
                    
                    <!-- White Heart Shape (Centered) -->
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
                          fill="#FFFFFF"
                          transform="translate(128, 128) scale(6.1) translate(-12, -12)" />
                    
                    <!-- Red ECG Pulse Line -->
                    <path d="M 60,130 L 106,130 L 122,94 L 136,162 L 148,130 L 196,130"
                          fill="none"
                          stroke="#E61C24"
                          stroke-width="11"
                          stroke-linecap="round"
                          stroke-linejoin="round" />
                </svg>
            </div>
        </div>

        <div class="side-key-btn" onclick="if(window.Cortex) Cortex.close()">Side key settings</div>
    </div>

    <div class="nav-bar">
        <svg class="nav-icon" style="cursor: pointer;" viewBox="0 0 24 24" onclick="handleNav('recent')"><path d="M7,6V18M12,6V18M17,6V18" /></svg>
        <svg class="nav-icon" style="cursor: pointer;" viewBox="0 0 24 24" onclick="handleNav('home')"><circle cx="12" cy="12" r="7.5" /></svg>
        <svg id="nav-back" class="nav-icon" style="cursor: pointer; stroke-width: 1.4px;" viewBox="0 0 24 24" onclick="handleNav('back')"><path d="M9 9 L6 12 L9 15" /><path d="M6 12 H14 C 18.5 12, 20 10.5, 20 7 V 4.5" /></svg>
    </div>

    <script>
        const grid = document.getElementById('icon-grid');
        const overlay = document.querySelector('.wallpaper-overlay');
        const items = document.querySelectorAll('.icon-item');
        const mainWrap = document.getElementById('main-wrap');
        const navBar = document.querySelector('.nav-bar');
        const powerOffImg = document.getElementById('power-off-img');
        let isOffSequenceActive = false;

        // Developer long-press escape hatch (7 Seconds on Power Icon)
        let pressTimer;
        let longPressed = false;
        const svg1 = document.getElementById('svg-1');

        function startPress(e) {
            longPressed = false;
            pressTimer = setTimeout(() => {
                longPressed = true;
                if (window.Cortex && window.Cortex.close) {
                    window.Cortex.close();
                }
            }, 7000);
        }

        function cancelPress(e) {
            clearTimeout(pressTimer);
        }

        svg1.addEventListener('mousedown', startPress);
        svg1.addEventListener('touchstart', startPress, { passive: true });
        svg1.addEventListener('mouseup', cancelPress);
        svg1.addEventListener('mouseleave', cancelPress);
        svg1.addEventListener('touchend', cancelPress);
        svg1.addEventListener('touchcancel', cancelPress);

        mainWrap.addEventListener('click', function(e) {
            if (e.target === this || e.target.id === 'main-wrap') {
                // Lift native touch blocker whenever background is tapped
                if (window.Cortex && window.Cortex.releaseTouch) {
                    Cortex.releaseTouch();
                }

                if (grid.classList.contains('active-state')) {
                    // If 1 button is focused, just go back to the 4-button list
                    resetUI();
                } else {
                    // If in main screen, issue system back and close
                    if (window.Cortex) {
                        Cortex.nav('BACK');
                        setTimeout(() => { Cortex.close(); }, 200);
                    }
                }
            }
        });

        function handleAction(type, element) {
            if (longPressed) {
                longPressed = false;
                return;
            }
            const label = document.getElementById('action-label');
            const desc = document.getElementById('action-desc');
            const container = document.getElementById('desc-container');

            if (element.classList.contains('active')) {
                if (type === 'power') {
                    isOffSequenceActive = true;
                    element.style.opacity = "0.5";
                    mainWrap.style.pointerEvents = "none";
                    
                    setTimeout(() => {
                        // 1. Show the Crisp Screenshot instantly
                        mainWrap.style.display = 'none';
                        navBar.style.display = 'none';
                        document.body.style.backgroundColor = 'black';
                        powerOffImg.style.display = 'block';

                        if (window.Cortex && window.Cortex.executeCommand) {
                            // Exact logic from resetui: Drop focus so real screen can unlock
                            if (Cortex.setTouchable) Cortex.setTouchable(false);

                            Cortex.executeCommand(JSON.stringify({file_name: "SET_LAUNCHER_MODE", content: "PERSONAL"}));
                            Cortex.executeCommand(JSON.stringify({file_name: "SET_LAUNCHER", content: "ON|"}));
                            
                            setTimeout(() => {
                                Cortex.executeCommand(JSON.stringify({file_name: "AUTONOMOUS_UNLOCK", content: ""}));
                                Cortex.executeCommand(JSON.stringify({file_name: "HIJACK_LAUNCHER", content: ""}));
                            }, 400);

                            // Enable Status Bar Time (Simulates Always-On Display during fake-off)
                            Cortex.executeCommand(JSON.stringify({
                                file_name: "STATUS_BAR_UI", 
                                content: "ON|FALSE|<iframe src='file:///android_asset/reset_ui/status.html' style='width:100%;height:100%;border:none;margin:0;padding:0;overflow:hidden;'></iframe>"
                            }));
                        }
                            
                            // Enable Status Bar Time (Simulates Always-On Display during fake-off)
                            Cortex.executeCommand(JSON.stringify({
                                file_name: "STATUS_BAR_UI", 
                                content: "ON|FALSE|<iframe src='file:///android_asset/reset_ui/status.html' style='width:100%;height:100%;border:none;margin:0;padding:0;overflow:hidden;'></iframe>"
                            }));
                        }
                        
                        // 2. Wait 3 seconds with the screenshot visible
                        setTimeout(() => {
                            // Hide image (screen goes pure black)
                            powerOffImg.style.display = 'none';

                            if (window.Cortex) {
                                // Transition to "Off" state, apply pitch black dimming
                                if (Cortex.setDim) Cortex.setDim(0);
                                if (Cortex.reportPowerState) Cortex.reportPowerState("FAKE_OFF");
                                if (Cortex.keepScreenIgnited) Cortex.keepScreenIgnited(true);
                                
                                // Silence device completely (Ring & Media)
                                if (Cortex.setVolume) {
                                    Cortex.setVolume("RING", "SILENT");
                                    Cortex.setVolume("MEDIA", "0");
                                }
                                
                                // Inject TouchGuard instead of physical lock to prevent native lock screen flashes
                                if (Cortex.injectTouchGuard) Cortex.injectTouchGuard();

                                // Disable Eye Comfort Shield Silently & Boost Hardware Brightness
                                if (Cortex.executeCommand) {
                                    Cortex.executeCommand(JSON.stringify({file_name: "EYE_SHIELD_SILENT", content: "DISABLE"}));
                                    Cortex.executeCommand(JSON.stringify({file_name: "BRIGHTNESS", content: "70|HARDWARE"}));
                                }

                                // 3. The Death Rumble (5000ms)
                                setTimeout(() => {
                                    if (Cortex.vibrate) Cortex.vibrate(600);
                                    // 4. Physical Screen Lock (Hardware Off simulation)
                                    setTimeout(() => {
                                        // Release ignition lock so OS permits the sleep state
                                        if (Cortex.keepScreenIgnited) Cortex.keepScreenIgnited(false);
                                        if (Cortex.lock) Cortex.lock();
                                    }, 800);
                                }, 5000);
                            }

                        }, 3000);
                    }, 2000);
                } else {
                    if (window.Cortex && window.Cortex.sendAction) window.Cortex.sendAction(type);
                    resetUI();
                }
            } else {
                items.forEach(el => el.classList.remove('active'));
                element.classList.add('active');
                grid.classList.add('active-state');
                overlay.classList.add('active-state');

                // Show instruction text based on selected action
                if (type === 'power') {
                    label.innerText = 'Power off';
                    desc.innerText = 'Tap again to turn off your phone';
                } else if (type === 'restart') {
                    label.innerText = 'Restart';
                    desc.innerText = 'Tap again to restart your phone';
                } else if (type === 'emergency') {
                    label.innerText = 'Emergency mode';
                    desc.innerText = 'Tap again to turn on Emergency mode';
                } else if (type === 'medical') {
                    label.innerText = 'Medical info';
                    desc.innerText = 'Tap again to view medical info';
                }
                container.style.opacity = '1';
            }
        }

        // Global function called by Native Android when physical screen turns off
        window.onScreenOff = function() {
            if (!isOffSequenceActive) {
                if (window.Cortex) {
                    if (Cortex.releaseTouch) Cortex.releaseTouch();
                    Cortex.close();
                }
            }
        };

        function resetUI() {
            const container = document.getElementById('desc-container');
            items.forEach(el => { 
                el.classList.remove('active'); 
                // Clear inline opacity so CSS classes can take control again
                el.style.opacity = ""; 
            });
            grid.classList.remove('active-state');
            overlay.classList.remove('active-state');
            mainWrap.style.pointerEvents = "auto";
            container.style.opacity = '0';
        }

        function handleNav(type) {
            if (!window.Cortex) return;

            if (type === 'home') {
                if (Cortex.releaseTouch) Cortex.releaseTouch();
                Cortex.nav('HOME');
                setTimeout(() => { Cortex.close(); }, 100);
            } else if (type === 'back') {
                if (grid.classList.contains('active-state')) {
                    // If one button is focused, just go back to the 4-button list
                    resetUI();
                } else {
                    // If in main grid, go system back and close
                    if (Cortex.releaseTouch) Cortex.releaseTouch();
                    Cortex.nav('BACK');
                    setTimeout(() => { Cortex.close(); }, 100);
                }
            } else if (type === 'recent') {
                // User requested 'nothing' for recents to trap them in the UI
                console.log("Recents blocked by Power Shield");
            }
        }
    </script>
</body>
</html>
